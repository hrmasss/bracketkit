name: Release

# Publishes bracketkit to npm when a v* tag is pushed (e.g. `git tag v0.1.0 && git
# push origin v0.1.0`). Requires an NPM_TOKEN repo secret (Automation token).
# Publishes with provenance (needs id-token: write + a public repo).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bracketkit build
      - name: Publish to npm
        working-directory: packages/bracketkit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
